name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cai-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run CAI platform tests
        run: mvn -B test
        working-directory: cai-platform
        if: ${{ hashFiles('cai-platform/pom.xml') != '' }}
      - name: No cai-platform yet — skip
        if: ${{ hashFiles('cai-platform/pom.xml') == '' }}
        run: echo "cai-platform not present on this branch; nothing to test"
